<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valve & Actuator Selector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-title">
      <span class="topbar-name">Valve &amp; Actuator Selector</span>
      <span class="topbar-sub">Accoppiamenti valvole – attuatori</span>
    </div>
    <div class="topbar-actions">
      <button id="toggleRecapBtn" class="btn btn-secondary">Tabella regole</button>
      <a href="https://alessenex.github.io/Dashboard_tools/" target="_blank" class="btn btn-secondary">Dashboard Tools</a>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-head">Selezione</div>
      <div class="panel-body">
        <div class="field">
          <label for="puntoImpiantoSelect">Punto di impianto</label>
          <div class="field-inline">
            <select id="puntoImpiantoSelect"></select>
            <span id="puntoImpiantoInfoIcon" class="info-icon" title="" style="display:none;">&#9432;</span>
          </div>
          <div id="puntoImpiantoInfoMsg" class="info-msg" style="display:none;"></div>
        </div>
        <div class="field">
          <label>Modello valvola</label>
          <div id="modelloValvolaTags" class="tag-row"></div>
        </div>
        <div class="field">
          <label>Tipologia attuatore</label>
          <div id="tipologiaTags" class="tag-row"></div>
        </div>
        <div class="field">
          <label>Misura</label>
          <div id="misuraTags" class="tag-row"></div>
        </div>
        <div class="field">
          <label>Tipo valvola</label>
          <div id="vieTags" class="tag-row"></div>
        </div>
        <label id="navaleBox" class="check" style="display:none;">
          <input type="checkbox" id="navaleCheck" /> Macchina navale (kit INOX-NAVI)
        </label>
        <p id="errore" class="error hidden"></p>
      </div>
    </section>

    <section class="panel result-panel">
      <div class="panel-head">Risultato</div>
      <div class="panel-body">
        <div class="result-empty">Completa la selezione per vedere valvola, adattatore, kit e attuatore.</div>
        <div id="risultato" class="hidden">
          <div class="res-table">
            <div id="valvolaInfo"></div>
            <div id="adattatoreInfo"></div>
            <div id="kitInfo"></div>
            <div id="motoreInfo"></div>
          </div>
          <div class="actions">
            <button id="saveConfigBtn" class="btn btn-primary" style="display:none;">Aggiungi alla lista</button>
            <button id="exportCsvBtn" class="btn btn-secondary" style="display:none;">Esporta CSV</button>
          </div>
        </div>
      </div>
    </section>

    <section id="configListBox" class="panel saved-panel" style="display:none;">
      <div class="panel-head">
        <span>Configurazioni salvate</span>
        <div class="actions actions-inline">
          <button id="exportAllCsvBtn" class="btn btn-secondary">Esporta CSV</button>
          <button id="exportSummaryPdfBtn" class="btn btn-secondary">Riepilogo PDF</button>
        </div>
      </div>
      <div class="panel-body panel-body-flush">
        <table id="configListTable" class="data-table"></table>
      </div>
    </section>
  </main>

  <!-- Modal tabella regole -->
  <div id="recapModal" class="modal" style="display:none;">
    <div class="modal-box modal-wide">
      <div class="modal-head">
        <h2>Tabella regole di accoppiamento</h2>
        <button id="closeRecapBtn" class="btn-close" aria-label="Chiudi">&times;</button>
      </div>
      <div class="modal-content">
        <aside class="recap-sidebar">
          <div class="recap-sidebar-title">Articoli disponibili</div>
          <div id="articoliDisponibili"></div>
        </aside>
        <div id="recapContent" class="recap-main"></div>
      </div>
    </div>
  </div>

  <!-- Modal preview CSV -->
  <div id="csvPreviewModal" class="modal" style="display:none;">
    <div class="modal-box">
      <div class="modal-head">
        <h2>Anteprima esportazione CSV</h2>
      </div>
      <div id="csvPreviewTableBox" class="modal-scroll"></div>
      <div class="actions actions-end">
        <button id="csvPreviewCancelBtn" class="btn btn-secondary">Annulla</button>
        <button id="csvPreviewConfirmBtn" class="btn btn-primary">Esporta CSV</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.0/jspdf.plugin.autotable.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/export.js"></script>
  <script src="js/export_pdf.js"></script>
</body>
</html>
